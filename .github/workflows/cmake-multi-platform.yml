name: Build Kiosk System

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  build_dir: build
  conan_config: Release

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Release GCC
            build_type: Release
            cpp_compiler: g++
            coverage: false
          - name: Debug Coverage GCC
            build_type: Debug
            cpp_compiler: g++
            coverage: true

    steps:
      - uses: actions/checkout@v4

      - name: Cache Conan packages
        uses: actions/cache@v3
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-${{ hashFiles('**/conanfile.txt') }}
          restore-keys: ${{ runner.os }}-conan-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf libtool pkg-config lcov

      - name: Install Conan (pipx for speed)
        run: |
          python3 -m pip install --user pipx
          ~/.local/bin/pipx install "conan<2.0.0" --include-deps

      - name: Configure Conan
        run: |
          ~/.local/bin/conan profile detect --force
          ~/.local/bin/conan install . \
            --output-folder=${{ env.build_dir }} \
            --build=never \
            -s build_type=${{ matrix.build_type }} \
            --require-approval=never \
            --client-conf tools.cmake.cmake_program:cmake="$(which cmake)" \
            --client-conf tools.system.package_manager:mode=install \
            --client-conf general.parallel_download=6
        env:
          CONAN_SYSREQUIRES_MODE: disabled

      - name: Create Proto directories
        run: mkdir -p ${{ github.workspace }}/proto/gen/kiosk

      - name: Configure CMake
        run: >
          cmake -B ${{ env.build_dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_TOOLCHAIN_FILE=${{ env.build_dir }}/conan_toolchain.cmake
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DENABLE_COVERAGE=${{ matrix.coverage }}

      - name: Build
        run: cmake --build ${{ env.build_dir }} --config ${{ matrix.build_type }} -j2

      - name: Test
        working-directory: ${{ env.build_dir }}
        run: |
          ctest --output-on-failure --build-config ${{ matrix.build_type }}

      - name: Generate coverage report
        if: ${{ matrix.coverage == true }}
        working-directory: ${{ env.build_dir }}
        run: |
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage report
        if: ${{ matrix.coverage == true }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.build_dir }}/coverage.info
