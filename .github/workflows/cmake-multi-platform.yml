name: Build Kiosk System

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  build_dir: build

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release GCC
            build_type: Release
            coverage: false
          - name: Debug Coverage GCC
            build_type: Debug
            coverage: true

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiosk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kiosk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: kiosk
      KIOSK_REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake lcov postgresql-client

      - name: Install Conan
        run: |
          pipx install "conan>=2,<3"
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.py') }}
          restore-keys: ${{ runner.os }}-conan-

      # Dependencies are always Release builds (prebuilt on Conan Center);
      # only this project's code is built with matrix.build_type.
      - name: Install dependencies
        run: >
          conan install .
          --output-folder=${{ env.build_dir }}
          --build=missing
          -s build_type=Release
          -s "&:build_type=${{ matrix.build_type }}"

      - name: Configure CMake
        run: >
          cmake -S . -B ${{ env.build_dir }}
          -DCMAKE_TOOLCHAIN_FILE=${{ env.build_dir }}/conan_toolchain.cmake
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DENABLE_COVERAGE=${{ matrix.coverage && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build ${{ env.build_dir }} --parallel

      - name: Load database schema
        run: psql -v ON_ERROR_STOP=1 -f sql/schema.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: kiosk

      - name: Test
        run: ctest --test-dir ${{ env.build_dir }} --output-on-failure

      - name: Generate coverage report
        if: ${{ matrix.coverage }}
        working-directory: ${{ env.build_dir }}
        run: |
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch
          lcov --extract coverage.info "${{ github.workspace }}/src/*" --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage report
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.build_dir }}/coverage.info
