syntax = "proto3";

option java_multiple_files = true;
option java_package = "io.grpc.examples.kiosk";
option java_outer_classname = "KioskProto";
option objc_class_prefix = "K";

package kiosk;

// The Kiosk Service definition
service Kiosk {
  // Movie operations
  rpc GetMovie (GetMovieRequest) returns (GetMovieResponse);
  rpc ListMovies (ListMoviesRequest) returns (ListMoviesResponse);
  rpc CreateMovie (CreateMovieRequest) returns (CreateMovieResponse);
  rpc DeleteMovie (DeleteMovieRequest) returns (DeleteMovieResponse);
  rpc UpdateMovie (UpdateMovieRequest) returns (UpdateMovieResponse);
  
  // Health check
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckResponse);
}

// Movie message representing a movie entity
message Movie {
  int32 id = 1;
  string name = 2;
  int32 release_year = 3;
  string description = 4;
  int32 duration = 5;
  string rating = 6;
  string created_at = 7;
  string updated_at = 8;
}

// Request/Response for GetMovie
message GetMovieRequest {
  int32 id = 1;
}

message GetMovieResponse {
  bool success = 1;
  string message = 2;
  Movie movie = 3;
}

// Request/Response for ListMovies
message ListMoviesRequest {
  int32 limit = 1;
  int32 offset = 2;
  string search_query = 3;
}

message ListMoviesResponse {
  bool success = 1;
  string message = 2;
  repeated Movie movies = 3;
  int32 total_count = 4;
}

// Request/Response for CreateMovie
message CreateMovieRequest {
  string name = 1;
  int32 release_year = 2;
  string description = 3;
  int32 duration = 4;
  string rating = 5;
}

message CreateMovieResponse {
  bool success = 1;
  string message = 2;
  Movie movie = 3;
}

// Request/Response for UpdateMovie
message UpdateMovieRequest {
  int32 id = 1;
  string name = 2;
  int32 release_year = 3;
  string description = 4;
  int32 duration = 5;
  string rating = 6;
}

message UpdateMovieResponse {
  bool success = 1;
  string message = 2;
  Movie movie = 3;
}

// Request/Response for DeleteMovie
message DeleteMovieRequest {
  int32 id = 1;
}

message DeleteMovieResponse {
  bool success = 1;
  string message = 2;
}

// Health check
message HealthCheckRequest {}

message HealthCheckResponse {
  bool healthy = 1;
  string message = 2;
}